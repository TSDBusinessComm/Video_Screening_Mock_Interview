<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSD Mock Interview</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--card:#fff;--tx:#14181f;--mut:#5b6573;--bd:#d9dee5;--ac:#1a56db;--on:#fff;--rec:#d92d20;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mut:#9aa5b4;--bd:#2c3541;--ac:#6b9bff;--on:#0b1220;--rec:#ff6b5e}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mut:#9aa5b4;--bd:#2c3541;--ac:#6b9bff;--on:#0b1220;--rec:#ff6b5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:.2em 0}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
label{display:block;font-size:.8rem;color:var(--mut)}
textarea,input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:4px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.row label{flex:1;min-width:110px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 18px;background:var(--ac);color:var(--on);cursor:pointer}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.stop{background:var(--rec);color:#fff}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut)}
.q{font-size:1.2rem;font-weight:600;margin:0}
.vid{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
.vid video.mir{transform:scaleX(-1)}
.badge{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:rgba(0,0,0,.6);color:#fff}
.badge.rec{background:var(--rec)}
.ctr{text-align:center;margin-top:12px}
#clock{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums}
#ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.err{color:var(--rec);margin-top:10px}
.ans video{width:100%;border-radius:8px;margin-top:8px;background:#000}

.header{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 16px 16px;margin-bottom:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.header img{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto 10px;border-radius:10px}
.header h1{margin:.15em 0 .1em;font-size:1.65rem}
.header p{margin:0;color:var(--mut);font-size:.92rem}
</style></head>
<body><div id="app"></div>

const D=["How did you hear about our company? What specifically interests you about working for our transportation industry?",
"Tell us about your work history, education or training, and any relevant certifications or licenses. Please include your experience working around or operating heavy equipment and using hand or power tools.",
"This is a 24/7, 365-day operation and the role is primarily outdoors. Tell us about your experience working non-traditional schedules (on-call, nights, weekends, or holidays) and in varying weather or environmental conditions.",
"Safety is our top priority. Tell us about your experience in the workplace as it relates to safety, such as safety meetings, training, and/or roles you have held.",
"Your supervisor gives you a piece of equipment you are not familiar with. It is your responsibility to learn how to operate the equipment in a safe manner to complete your job. What steps will you take to learn and understand how to use the equipment safely?",
"Describe a time when following the rules slowed the job down. How did you handle it?",
"You and your coworker disagree about the correct way to fix a problem that has occurred during your shift. How would you handle the situation to make sure the problem gets fixed?",
"How do you manage fatigue to remain alert and safe during long or irregular shifts?",
"Tell us about a time your attendance was tested (fatigue, weather, personal conflict). What decision did you make and why?",

async function start(){
  const list=qs.map(q=>({t:q.t.trim(),th:Math.max(0,+q.th||0),rt:Math.max(10,+q.rt||120),at:Math.min(5,Math.max(1,+q.at||3))})).filter(q=>q.t);
  if(!list.length){$('err').textContent='Add at least one question.';return}
  qs=list;save();
  try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}
  catch(e){$('err').textContent='Camera and microphone access is needed. Allow it in your browser, or open this page in its own tab if it is embedded.';return}
  i=0;res=[];think();
}

function count(sec,upd,cb){
  clearInterval(tm);const end=Date.now()+sec*1000;
  const f=()=>{const r=Math.max(0,Math.ceil((end-Date.now())/1000));upd(r);if(r<=0){clearInterval(tm);cb();return true}};
  if(!f())tm=setInterval(f,200);
}

function att(){
  const q=qs[i],n=phase==='think'?used+1:used;
  $('att').textContent=phase==='review'?`Attempts left: ${q.at-used}`:`Attempt ${n} of ${q.at}`;
}
function badge(t,r){const b=$('badge');b.textContent=t;b.className='badge'+(r?' rec':'')}

function think(){
  used=used||0;phase='think';view();badge('THINK TIME');
  const q=qs[i];
  $('ctl').innerHTML=`<button data-act="skip">Start recording now</button>`;
  count(q.th,r=>{$('clock').textContent=fmt(r)},record);
}
function record(){
  clearInterval(tm);const q=qs[i];
  used++;phase='rec';att();badge('● RECORDING',1);
  $('ctl').innerHTML=`<button class="stop" data-act="stop">Finish answer</button>`;
  chunks=[];
  try{rec=new MediaRecorder(stream)}catch(e){app.insertAdjacentHTML('beforeend','<p class="err">Recording is not supported in this browser.</p>');return}
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=review;rec.start();
  count(q.rt,r=>{$('clock').textContent=fmt(r)},stopRec);
}
function stopRec(){clearInterval(tm);if(rec&&rec.state!=='inactive')rec.stop()}
function review(){
  const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});
  cur={blob,url:URL.createObjectURL(blob)};
  phase='review';view();badge('REVIEW');
  const q=qs[i];
  $('clock').textContent='Review your answer';$('clock').style.fontSize='1.1rem';
  $('ctl').innerHTML=(used<q.at?`<button class="ghost" data-act="retake">Retake (${q.at-used} left)</button>`:'')+`<button data-act="submit">Submit answer</button>`;
}
function submit(){
  res[i]=cur;i++;used=0;
  if(i<qs.length)think();else finish();
}
function saveVideo(k){
  const item=res[k]; if(!item)return;
  const a=document.createElement('a'); a.href=item.url; a.download=`TSD_Question_${k+1}.webm`; document.body.appendChild(a); a.click(); a.remove();
}
function saveAll(){
  res.forEach((_,k)=>saveVideo(k));
}

// Create a ZIP file directly in the browser (no external libraries required).
function crc32(bytes){
  let c=0xffffffff;
  for(let i=0;i<bytes.length;i++){
    c^=bytes[i];
    for(let j=0;j<8;j++) c=(c>>>1)^((c&1)?0xedb88320:0);
  }
  return (c^0xffffffff)>>>0;
}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}
function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function cat(...parts){
  const out=new Uint8Array(parts.reduce((n,p)=>n+p.length,0)); let o=0;
  for(const p of parts){out.set(p,o);o+=p.length} return out;
}
async function createZipBlob(){
  const items=res.map((item,k)=>({name:`TSD_Question_${k+1}.webm`,blob:item.blob})).filter(x=>x.blob);
  if(!items.length)return;
  const local=[],central=[]; let offset=0;
  for(const item of items){
    const data=new Uint8Array(await item.blob.arrayBuffer());
    const name=new TextEncoder().encode(item.name), crc=crc32(data);
    const header=cat(new Uint8Array([0x50,0x4b,0x03,0x04]),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name);
    local.push(header,data);
    const ch=cat(new Uint8Array([0x50,0x4b,0x01,0x02]),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name);
    central.push(ch); offset+=header.length+data.length;
  }
  const centralSize=central.reduce((n,p)=>n+p.length,0);
  const end=cat(new Uint8Array([0x50,0x4b,0x05,0x06]),u16(0),u16(0),u16(items.length),u16(items.length),u32(centralSize),u32(offset),u16(0));
  const zip=new Blob([...local,...central,end],{type:'application/zip'});
  return zip;
}

async function downloadZip(){
  const zip=await createZipBlob();
  if(!zip)return;
  const url=URL.createObjectURL(zip);
  const a=document.createElement('a'); a.href=url; a.download='TSD_All_Video_Responses.zip'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function emailAll(){
  const zip=await createZipBlob();
  if(!zip)return;
  const file=new File([zip],'TSD_All_Video_Responses.zip',{type:'application/zip'});
  const subject='TSD Mock Interview Video Responses';
  const body='Attached are my TSD mock interview video responses.';

  if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{
      await navigator.share({title:subject,text:body,files:[file]});
      return;
    }catch(err){
      if(err && err.name==='AbortError') return;
    }
  }

  // Desktop browsers generally cannot attach a local file automatically to mailto links.
  // Download the ZIP first, then open the user's email application with a prepared message.
  const url=URL.createObjectURL(zip);
  const a=document.createElement('a'); a.href=url; a.download='TSD_All_Video_Responses.zip'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  window.location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body+'\n\nThe ZIP file was downloaded to your computer. Please attach TSD_All_Video_Responses.zip before sending.');
}

});
